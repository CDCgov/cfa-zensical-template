[project]
name = "cfadoc"
version = "0.4.0"
description = ""
authors = [{ name = "Scott Olesen", email = "ulp7@cdc.gov" }]
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "chevron>=0.14.0",
    "inquirer>=3.4.1",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
docs = [
    "mdx-truly-sane-lists>=1.3",
    "mkdocstrings-python>=2.0.3",
    "zensical>=0.0.34",
]

[project.scripts]
cfadoc = "cfadoc:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
